name: live-music-remover

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Build
      run: cargo +nightly run -p live-music-remover --features "ui" --bin live-music-remover --release --verbose
#   - name: Run tests
#     run: cargo test --verbose
